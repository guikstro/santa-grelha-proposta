<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Santa Grelha · links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Raleway:wght@400;500;600&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
/* Santa Grelha, link da bio: a toalha branca e a comanda. Tudo centrado, como carta de restaurante clássico.
   O monograma em vermelho é o único peso; as casas são os dois canhotos da comanda; os links são linhas de carta. */
:root{--toalha:#FBFAF8;--papel:#FFFFFF;--tinta:#1B1616;--tinta-2:#5E5555;--sg:#C4161C;--sg-escuro:#8E0E13;--regra:#DDD5D0;
 --serif:'Bodoni Moda',Didot,serif;--sans:'Raleway',system-ui,sans-serif;
 --logo:url(https://static.wixstatic.com/media/404bb8_81e786be002e46a6983a11a3dbeebdc5~mv2.png/v1/fill/w_600,h_440,al_c,q_85/sg.png)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--toalha);color:var(--tinta);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-align:center}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--sg);outline-offset:3px}
.demo{background:var(--tinta);color:var(--toalha);font-size:12.5px;padding:6px 12px}
.pg{max-width:420px;margin:0 auto;padding:22px 22px 40px}
.mono{width:112px;height:82px;margin:0 auto;background:var(--sg);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.desde{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--tinta-2);margin-top:6px}

/* a comanda: papel com picote, dois canhotos */
.comanda{margin:22px 0 0;background:var(--papel);border:1px solid var(--regra);position:relative;
 -webkit-mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
         mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.canhotos{display:grid;grid-template-columns:1fr 1fr}
.canhotos button{background:none;border:0;font:inherit;color:var(--tinta);padding:16px 8px 14px;cursor:pointer;min-height:84px}
.canhotos button+button{border-left:1px dashed var(--regra)}
.canhotos b{display:block;font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.1}
.canhotos small{display:block;font-family:'Nanum Pen Script','Bradley Hand',cursive;font-size:22px;line-height:1.1;color:#26387A;margin-top:4px}
.canhotos button[aria-pressed=true] b{color:var(--sg)}
.canhotos button[aria-pressed=true]{background:linear-gradient(var(--sg),var(--sg)) center bottom/40% 2px no-repeat}
.picote{border-top:2px dotted var(--regra);margin:0 14px}
.reservar{display:flex;align-items:center;justify-content:center;margin:14px;min-height:56px;background:var(--sg);color:#fff;font:600 17px var(--sans)}
.reservar:hover{background:var(--sg-escuro)}

/* a carta de links */
.carta{margin-top:30px}
.carta a{display:flex;align-items:baseline;gap:8px;min-height:48px;padding:12px 0;text-align:left;font-family:var(--serif);font-size:19px}
.carta a::after{content:'';order:2;flex:1;border-bottom:2px dotted #c9bfba;transform:translateY(-5px)}
.carta a span{order:3;font:500 14px var(--sans);color:var(--sg)}
.carta a:hover{color:var(--sg)}
.hoje{margin-top:24px;font-size:14px;color:var(--tinta-2)}
footer{margin-top:26px;font-size:12.5px;color:var(--tinta-2)}
</style>
</head>
<body>
<div class="demo">Protótipo da Timeless para o Santa Grelha. Não é a página oficial da casa.</div>
<div class="pg">
  <div class="mono" role="img" aria-label="Santa Grelha"></div>
  <p class="desde">Na brasa desde 2000</p>

  <div class="comanda">
    <div class="canhotos" id="canhotos" role="group" aria-label="Escolha a casa"></div>
    <div class="picote"></div>
    <a class="reservar" id="reservar" href="../#comanda">Reservar mesa</a>
  </div>

  <nav class="carta" aria-label="Links">
    <a href="../#cardapio">Cardápio<span>ver</span></a>
    <a href="../?lang=en#cardapio" lang="en">Menu in English<span>read</span></a>
    <a href="https://ifoodbr.onelink.me/F4X4/Santagrelha" target="_blank" rel="noopener">Delivery<span>iFood</span></a>
    <a href="../#eventos">Eventos e grupos<span>pedir</span></a>
    <a id="mapa" href="#" target="_blank" rel="noopener">Como chegar<span id="mapa-t">mapa</span></a>
    <a id="trip" href="#" target="_blank" rel="noopener">Avaliações<span>Tripadvisor</span></a>
  </nav>
  <p class="hoje" id="end"></p>
  <footer>Grupo Social Clube. Horários e preços conferidos em 24/11/2026.</footer>
</div>
<script src="../marca.js"></script>
<script src="../comum.js"></script>
<script>
const CH=MARCA.id+'-casa';
let casa=(()=>{try{return localStorage.getItem(CH)}catch(e){return null}})();
if(!unidade(casa))casa=MARCA.unidades[0].id;
const est=u=>{const s=estadoUnidade(u);return s.k==='aberta'?`aberta até ${hm(s.ate)}`:s.k==='fechada'?`abre amanhã, ${hm(s.abre)}`:`abre às ${hm(s.abre)}`;};
function pinta(){
  const u=unidade(casa);
  document.getElementById('canhotos').innerHTML=MARCA.unidades.map(x=>`<button type="button" data-c="${x.id}" aria-pressed="${x.id===casa}"><b>${x.nome}</b><small>${est(x)}</small></button>`).join('');
  const r=document.getElementById('reservar');r.href=`../?casa=${u.id}#comanda`;r.textContent=`Reservar no ${u.nome}`;
  document.getElementById('mapa').href=u.mapa;document.getElementById('mapa-t').textContent=u.nome;
  document.getElementById('end').textContent=u.end;
}
document.getElementById('canhotos').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;casa=b.dataset.c;try{localStorage.setItem(CH,casa)}catch(e){}pinta();});
document.getElementById('trip').href=MARCA.trip;
pinta();setInterval(pinta,60000);
</script>
</body>
</html>
