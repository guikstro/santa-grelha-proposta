<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f2ec">
<title>Reservar · Santa Grelha</title>
<meta name="description" content="Reserve a sua mesa no Santa Grelha, Meireles ou Iguatemi.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../estilo.css">
<style>
/* Endereço próprio da reserva (santagrelha.com.br/reservar): a mesma comanda do site e da bio, sozinha na página. */
.demo{position:fixed;z-index:60;left:0;right:0;bottom:0;font-size:11px;text-align:center;padding:6px 10px;background:var(--onix);color:rgba(246,242,236,.7)}
.topo{display:flex;justify-content:space-between;align-items:center;padding:22px 32px;border-bottom:1px solid var(--pedra)}
.topo .mono{--w:52px;color:var(--sg)}
.pg{max-width:1200px;margin:0 auto;padding:56px 32px 120px;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:start}
.pg>*{min-width:0}
@media (max-width:900px){.topo{padding:16px 18px}.pg{grid-template-columns:1fr;gap:28px;padding:32px 18px 100px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="tinta"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></svg>
<div class="demo">Protótipo da Timeless para o Santa Grelha. Não é o site oficial.</div>
<header class="topo"><a href="../" aria-label="Santa Grelha, início"><span class="mono" aria-hidden="true"></span></a><div style="display:flex;gap:20px;align-items:center"><a class="link" href="../" id="site">Site</a><button type="button" class="link" id="lang" aria-label="Ver em inglês">EN</button></div></header>
<main class="pg">
  <div><h1 class="serif d-xl" id="tit">Reserve a sua mesa.</h1><p class="corpo" style="margin-top:22px" id="sub">Uma pergunta por vez. A comanda se escreve enquanto você escolhe. Até 5 pessoas, a mesa sai confirmada na hora; a partir de 6, a equipe junta as mesas e responde pelo WhatsApp da casa.</p></div>
  <div id="reserva"></div>
</main>
<script src="../marca.js"></script>
<script src="../comum.js"></script>
<script src="../reserva.js"></script>
<script>
const reserva=Reserva.monta(document.getElementById('reserva'),{origem:'reservar'});
function aplicaLang(){const bl=document.getElementById('lang');bl.textContent=lang==='en'?'PT':'EN';bl.setAttribute('aria-label',lang==='en'?'Ver em português':'Ver em inglês');document.documentElement.lang=lang==='en'?'en':'pt-BR';
  document.getElementById('tit').textContent=L('Reserve a sua mesa.','Book your table.');document.getElementById('site').textContent=L('Site','Website');
  document.getElementById('sub').textContent=L('Uma pergunta por vez. A comanda se escreve enquanto você escolhe. Até 5 pessoas, a mesa sai confirmada na hora; a partir de 6, a equipe junta as mesas e responde pelo WhatsApp da casa.','One question at a time. The slip fills in as you choose. Up to 5 guests, the table is confirmed instantly; from 6, the team joins tables and replies on WhatsApp.');reserva.pinta();}
document.getElementById('lang').addEventListener('click',()=>{setLang(lang==='en'?'pt':'en');aplicaLang();});
aplicaLang();
</script>
</body>
</html>
